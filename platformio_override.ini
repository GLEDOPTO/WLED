[platformio]
default_envs =
	GL-C-211WL
	GL-C-615WL ; = GL-C-015WL-M
	GL-C-616WL
	GL-C-618WL
	GL-C-620WL
	GL-C-017WL
	GL-C-619WL
	GL-C-611WL
	GL-C-116WL ; = GL-C-116WL-RF
	GL-C-118WL

[gledopto_flags]
build_flags =
 -D WLED_BRAND="\"GLEDOPTO\""
 -D SERVERNAME='"WLED-Gledopto"'
 -D WLED_AP_SSID="\"WLED-AP\"" 

; microphone configuration
[mic_pdm]
build_flags =
	  -D UM_AUDIOREACTIVE_ENABLE
	  -D SR_DMTYPE=5
	  -D I2S_SDPIN=32
	  -D I2S_WSPIN=15
	  -D I2S_CKPIN=-1
	  -D MCLK_PIN=-1
	  -D SR_AGC=2
	  -D SR_SQUELCH=4

[env:GL-C-211WL]
extends = env:esp32dev
build_flags =
	  -D WLED_RELEASE_NAME="\"GL-C-211W\""
	  ${env:esp32dev.build_flags}
	  ${gledopto_flags.build_flags}
      ; button configuration
	  -D BTNPIN=0,-1,-1,-1
	  -D BTNTYPE=2
      ; led configuration
      -D DATA_PINS=19,18,17,16,4
	  -D LED_TYPES=45
	  -D WLED_PRODUCT_NAME="\"GL-C-211WL\""

[env:GL-C-615WL]
extends = env:esp32dev
build_flags =
	  -D WLED_RELEASE_NAME="\"GL-C-615WL\""
	  ${env:esp32dev.build_flags}
	  ${gledopto_flags.build_flags}
      ${mic_pdm.build_flags}
      ; button configuration
	  -D RLYPIN=18
	  -D RLYMDE=true
	  -D BTNPIN=17,-1,-1,-1
	  -D BTNTYPE=2
      ; led configuration
	  -D DATA_PINS=16,2
	  -D PIXEL_COUNTS=30,30
	  -D LED_TYPES=22,22
	  -D WLED_PRODUCT_NAME="\"GL-C-615WL\""

[env:GL-C-616WL]
extends = env:esp32_eth
build_flags =
      -D WLED_RELEASE_NAME="\"GL-C-616WL\""
	  ${env:esp32_eth.build_flags}
	  ${gledopto_flags.build_flags}
      ${mic_pdm.build_flags}
      ; button configuration
	  -D RLYPIN=18
	  -D RLYMDE=true
	  -D BTNPIN=17,-1,-1,-1
	  -D BTNTYPE=2
      ; led configuration
	  -D DATA_PINS=16,2
	  -D PIXEL_COUNTS=30,30
	  -D LED_TYPES=22,22
      -D WLED_ETH_DEFAULT=13
	  -D WLED_PRODUCT_NAME="\"GL-C-616WL\""

[env:GL-C-618WL]
extends = env:esp32_eth
build_flags =
      -D WLED_RELEASE_NAME="\"GL-C-618WL\""
	  ${env:esp32_eth.build_flags}
	  ${gledopto_flags.build_flags}
      ${mic_pdm.build_flags}
      ; button configuration
	  -D RLYPIN=18
	  -D RLYMDE=true
	  -D BTNPIN=17,-1,-1,-1
	  -D BTNTYPE=2
      ; led configuration
	  -D DATA_PINS=16,12,4,2
	  -D PIXEL_COUNTS=30,30,30,30
	  -D LED_TYPES=22,22,22,22
      ; Ethernet configuration
      -D WLED_ETH_DEFAULT=13 ; gledopto ethernet
	  -D WLED_PRODUCT_NAME="\"GL-C-618WL\""

[env:GL-C-620WL]
extends = env:esp32_eth
build_flags =
      -D WLED_RELEASE_NAME="\"GL-C-620WL\""
	  ${env:esp32_eth.build_flags}
	  ${gledopto_flags.build_flags}
      ${mic_pdm.build_flags}
      ; button configuration
	  -D RLYPIN=18
	  -D RLYMDE=true
	  -D BTNPIN=17,-1,-1,-1
	  -D BTNTYPE=2
      ; led configuration
	  -D DATA_PINS=2,4,16
	  -D PIXEL_COUNTS=1,30
      -D LED_TYPES=42,22
      ; Ethernet configuration
      -D WLED_ETH_DEFAULT=13 ; gledopto ethernet
      -D WLED_BOOT_PRESET=1
	  -D WLED_PRODUCT_NAME="\"GL-C-620WL\""

[env:GL-C-017WL]
extends = env:esp32dev
build_flags =
      -D WLED_RELEASE_NAME="\"GL-C-017WL\""
	  ${env:esp32dev.build_flags}
	  ${gledopto_flags.build_flags}
      ${mic_pdm.build_flags}
	  -D RLYPIN=18
	  -D RLYMDE=true
	  -D BTNPIN=17,-1,-1,-1
	  -D BTNTYPE=2
      ; led configuration
      -D DATA_PINS=16,12,4,2
	  -D LED_TYPES=22,22,22,22
	  -D WLED_PRODUCT_NAME="\"GL-C-017WL\""
    ;   -D WLED_DEBUG

[env:GL-C-619WL]
extends = env:esp32_eth
build_flags =
	  -D WLED_RELEASE_NAME="\"GL-C-619WL\""
	  ${env:esp32_eth.build_flags}
	  ${gledopto_flags.build_flags}
      ${mic_pdm.build_flags}
      ; button configuration
	  -D RLYPIN=18
	  -D RLYMDE=true
	  -D BTNPIN=17,-1,-1,-1
	  -D BTNTYPE=2
      ; led configuration
	  -D DATA_PINS=16,14,13,12,4,2
	  -D PIXEL_COUNTS=30,30,30,30,30,30
	  -D LED_TYPES=22,22,22,22,22,22
      -D WLED_ETH_DEFAULT=13
	  -D WLED_PRODUCT_NAME="\"GL-C-619WL\""

[env:GL-C-611WL]
extends = env:esp32_eth
build_flags =
	  -D WLED_RELEASE_NAME="\"GL-C-611WL\""
	  ${env:esp32_eth.build_flags}
	  ${gledopto_flags.build_flags}
	  ${mic_pdm.build_flags}
	  -D BTNPIN=17,-1,-1,-1
	  -D BTNTYPE=2
	  -D DATA_PINS=18,16,12,4,2
	  -D LED_TYPES=45
	  -D WLED_ETH_DEFAULT=13
	  -D WLED_PRODUCT_NAME="\"GL-C-611W\""
	  
[env:GL-C-116WL]
extends = env:esp32dev
custom_usermods = audioreactive multi_relay
build_flags =
	  -D WLED_RELEASE_NAME="\"GL-C-116WL\""
	  ${env:esp32dev.build_flags}
	  ${gledopto_flags.build_flags}
	  -D BTNPIN=17,-1,-1,-1
	  -D BTNTYPE=2
	  -D USERMOD_MULTI_RELAY
	  -D MULTI_RELAY_MAX_RELAYS=2
	  -D MULTI_RELAY_PINS=21,19
	  ${mic_pdm.build_flags}
	  -D DATA_PINS=16,2
	  -D PIXEL_COUNTS=30,30
	  -D LED_TYPES=22,22

[env:GL-C-118WL]
extends = env:esp32dev
custom_usermods = audioreactive multi_relay
build_flags =
	  -D WLED_RELEASE_NAME="\"GL-C-118WL\""
	  ${env:esp32dev.build_flags}
	  ${gledopto_flags.build_flags}
	;   button
	  -D BTNPIN=17,-1,-1,-1
	  -D BTNTYPE=2
	;   relay
	  -D USERMOD_MULTI_RELAY
	  -D MULTI_RELAY_MAX_RELAYS=2
	  -D MULTI_RELAY_PINS=21,19
	;   ${mic_pdm.build_flags}
	;   led
	  -D DATA_PINS=16,2
	  -D PIXEL_COUNTS=30,30
	  -D LED_TYPES=22,22
	;   I2C
	  -D I2CSDAPIN=18
	  -D I2CSCLPIN=14
	;   ES8390
	  -D UM_AUDIOREACTIVE_ENABLE=true
      -D SR_ES8390
	  -D SR_DMTYPE=7 ; 7 is ES8390
	  -D I2S_SDPIN=35
	  -D I2S_WSPIN=13
	  -D I2S_CKPIN=4
	  -D MCLK_PIN=0
	  -D SR_AGC=2
	  -D SR_SQUELCH=10
    ;   -D WLED_DEBUG
    ;   -D SR_DEBUG
